services:
  - type: web
    name: ai-rtl-engineering-platform
    runtime: docker
    rootDir: AI_RTL_Engineering_Platform
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SIM_TIMEOUT
        value: "12"
